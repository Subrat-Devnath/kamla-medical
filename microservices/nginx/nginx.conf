events {}

http {

upstream frontend {
    server frontend:80;
}

upstream apiGateway {
    server api-gateway:8079;
}

# =====================================================
# HTTP -> HTTPS REDIRECT
# =====================================================
server {
    listen 80;
    server_name kamlamedical.com www.kamlamedical.com;

    return 301 https://$host$request_uri;
}

# =====================================================
# HTTPS SERVER
# =====================================================
server {

    listen 443 ssl http2;
    server_name kamlamedical.com www.kamlamedical.com;

    ssl_certificate /etc/letsencrypt/live/kamlamedical.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kamlamedical.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 100M;

    # =====================================
    # FRONTEND (React Application)
    # =====================================
    location / {

        proxy_pass http://frontend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =====================================
    # API GATEWAY SERVICES
    # =====================================
    location /api-gateway/ {

        proxy_pass http://apiGateway;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    # =====================================
    # USER MANAGEMENT
    # =====================================
    location /user-mgmt/ {

        proxy_pass http://apiGateway;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =====================================
    # SECURITY
    # =====================================
    location /security/ {

        proxy_pass http://apiGateway;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =====================================
    # PRODUCT MANAGEMENT
    # =====================================
    location /product-mgmt/ {

        proxy_pass http://apiGateway;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =====================================
    # EMAIL
    # =====================================
    location /email/ {

        proxy_pass http://apiGateway;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =====================================
    # WEBSOCKET SUPPORT
    # =====================================
    location /ws/ {

        proxy_pass http://apiGateway/ws/;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }
}

}
