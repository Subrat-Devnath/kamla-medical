server:
  port: 8082
  servlet:
    context-path: /product-mgmt
    
spring:
  application:
    name: product-mgmt

  data:
    cassandra:
      contact-points: ${CASSANDRA_CONTACTPOINTS}
      port: 9042
      keyspace-name: ${CASSANDRA_KEYSPACE}
      local-datacenter: ${CASSANDRA_LOCALDATACENTER}
      username: ${CASSANDRA_USER}
      password: ${CASSANDRA_PASSWORD}
      schema-action: create_if_not_exists

eureka:
  client:
    register-with-eureka: true       # register to eureka
    fetch-registry: true    
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}   
      
##--------- fien properties ---------

user:
  contextPath: "/user-mgmt"
  url: "http://user-mgmt:8081"

product:
  contextPath: "/product-mgmt"
  url: "http://product-mgmt:8082"

email:
  contextPath: "/email"
  url: "http://email:8085"

security:
  contextPath: "/security"
  url: "http://security:8084"

  ## ----------- SECURITY PROPERTIES -------
  jwt:
    # Secret key used to sign JWT tokens (Base64 encoded string recommended)
    # Must be strong & long (at least 256-bit for HS256, 512-bit for HS512)
    secret: bXlTdXBlclNlY3VyZUhTNTEyS2V5VGhhdElzQXRMZWFzdDY0Qnl0ZXNMb25nRm9yU2VjdXJlSldUVG9rZW5TaWduaW5nMTIzNDU2
    # Access token validity time (in seconds)
    # 36000 sec = 10 hours
    access-ttl-seconds: 36000
    # Refresh token validity time (in seconds)
    # 86400 sec = 24 hours
    refresh-ttl-seconds: 86400
    # Issuer of the JWT token (who created the token)
    # Used for validation and tracking
    issuer: kamlamedical.com
    # Cookie name where access token will be stored in browser
    access-token-cookie-name: accessToken
    # Cookie name where refresh token will be stored
    refresh-token-cookie-name: refreshToken
    # If true → cookie will only be sent over HTTPS (recommended for production)
    cookie-secure: true
    # If true → cookie cannot be accessed via JavaScript (protects from XSS attacks)
    cookie-http-only: true
    # SameSite policy for cookies:
    # lax → allows cookies in same-site + top-level navigation
    # strict → only same-site
    # none → cross-site allowed (requires secure=true)
    cookie-same-site: lax
    # Domain for which cookie is valid
    # 'localhost' works for local dev, in prod use your actual domain (e.g., example.com)
    cookie-domain: kamlamedical.com