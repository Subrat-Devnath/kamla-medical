server:
  port: 8084

  servlet:
    context-path: /security
    
spring:
  application:
    name: security

  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate.ddl-auto: update
    generate-ddl: true
    show-sql: true

eureka:
  client:
    register-with-eureka: true       # register to eureka
    fetch-registry: true    
    service-url:
      defaultZone: http://localhost:8761/eureka/ 
      #defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}   

##--------- fien properties ---------

user:
  contextPath: "/user-mgmt"
  url: "http://user-mgmt:8081"

product:
  contextPath: "/product-mgmt"
  url: "http://product-mgmt:8082"

email:
  contextPath: "/email"
  url: "http://email:8085"

security:
  contextPath: "/security"
  url: "http://security:8084"

